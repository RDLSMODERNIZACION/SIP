services:
  - type: web
    name: sip-certificados-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: PUBLIC_BASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: "https://sipinstrumentacion.com,https://www.sipinstrumentacion.com,http://localhost:3000,http://127.0.0.1:3000"
